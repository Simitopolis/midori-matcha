<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>MIDORI — Matcha</title>

    <link rel="stylesheet" href="./style.css?v=10" />

    <noscript>
      <style>
        .home-page .matcha-green,
        .home-page .matcha-green .header,
        .home-page .matcha-green .hero-content {
          opacity: 1 !important;
        }

        .home-page .matcha-green {
          pointer-events: auto !important;
        }

        .home-page .matcha-journey {
          height: 100vh !important;
        }

        .home-page .matcha-3d,
        .home-page .scroll-cue {
          display: none !important;
        }
      </style>
    </noscript>
  </head>

  <body>
    <div class="page home-page" id="home">
      <section class="matcha-journey">
        <div class="matcha-journey__sticky">
          <!-- 3D MATCHA INTRO -->
          <div class="matcha-3d" id="matcha-3d-canvas" aria-hidden="true">
            <img src="./pic/2.png" class="matcha-3d__fallback" alt="" />
          </div>

          <!-- SCROLL HINT -->
          <button
            class="scroll-cue"
            type="button"
            aria-label="Scroll down to enter MIDORI"
          >
            <span>SCROLL TO ENTER</span>
            <span class="scroll-cue__arrow" aria-hidden="true">↓</span>
          </button>

          <!-- GREEN HOMEPAGE -->
          <div class="matcha-green" id="main-menu">
            <header class="header">
              <a href="#home" class="logo"> MIDORI<sup>®</sup> </a>

              <!-- MOBILE BURGER -->
              <button
                class="menu-toggle"
                type="button"
                aria-label="Open menu"
                aria-expanded="false"
                aria-controls="mobile-navigation"
              >
                <span></span>
                <span></span>
                <span></span>
              </button>

              <nav
                class="navigation"
                id="mobile-navigation"
                aria-label="Main navigation"
              >
                <a href="./menu.html">Menu</a>
                <a href="./story.html">Our story</a>
                <a href="./visit.html">Visit Us</a>
              </nav>

              <a href="./reserve.html" class="reserve-button">
                Reserve a table
                <span aria-hidden="true">→</span>
              </a>
            </header>

            <!-- HERO -->
            <main class="hero">
              <div class="hero-content">
                <h1>
                  <span class="hero-title-main"> matcha. </span>

                  <span class="hero-title-sub"> Made into a moment. </span>
                </h1>

                <p class="description">
                  Specialty matcha drinks, signature desserts, and a calm café
                  atmosphere inspired by modern Asian aesthetics.
                </p>

                <div class="hero-buttons">
                  <a href="./menu.html" class="btn btn-dark">
                    Explore Menu
                    <span aria-hidden="true">→</span>
                  </a>

                  <a href="./visit.html" class="btn btn-light"> Visit Us </a>
                </div>
              </div>

              <div class="hero-symbol" aria-hidden="true">緑</div>
            </main>
          </div>
        </div>
      </section>
    </div>

    <!-- EXISTING 3D SCRIPT -->
    <script type="module" src="./matcha-3d.js"></script>

    <!-- MOBILE NAVIGATION -->
    <script>
      const menuToggle = document.querySelector(".menu-toggle");

      const mobileNavigation = document.querySelector("#mobile-navigation");

      if (menuToggle && mobileNavigation) {
        function setMenuOpen(isOpen) {
          menuToggle.classList.toggle("is-open", isOpen);

          mobileNavigation.classList.toggle("is-open", isOpen);

          menuToggle.setAttribute("aria-expanded", String(isOpen));

          menuToggle.setAttribute(
            "aria-label",
            isOpen ? "Close menu" : "Open menu",
          );
        }

        menuToggle.addEventListener("click", () => {
          const isOpen = menuToggle.getAttribute("aria-expanded") === "true";

          setMenuOpen(!isOpen);
        });

        mobileNavigation.querySelectorAll("a").forEach((link) => {
          link.addEventListener("click", () => {
            setMenuOpen(false);
          });
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            setMenuOpen(false);
          }
        });

        document.addEventListener("click", (event) => {
          if (
            !menuToggle.contains(event.target) &&
            !mobileNavigation.contains(event.target)
          ) {
            setMenuOpen(false);
          }
        });

        window.addEventListener("resize", () => {
          if (window.innerWidth > 768) {
            setMenuOpen(false);
          }
        });
      }
    </script>
  </body>
</html>
